name: CI

on:
  push:
    branches: [rediseño-2026, develop, main]
  pull_request:
    branches: [rediseño-2026, develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run test:i18n
      - run: npm run build
